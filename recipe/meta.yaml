# Note that this feedstock must be paired with bumping the version for
# `pyarrow-feedstock` as well. The two are tightly coupled. This is the CPP
# component/backend, `pyarrow` has the Python libraries. Also, the SHA-256
# hashes should match.
{% set name = "arrow-cpp" %}
{% set version = "24.0.0" %}
{% set build_number = 0 %}
{% set cuda_enabled = (gpu_variant or "").startswith("cuda") %}
# see https://github.com/apache/arrow/blob/apache-arrow-24.0.0/cpp/CMakeLists.txt#L133-L142
{% set so_version = (version.split(".")[0] | int * 100 + version.split(".")[1] | int) ~ "." ~ version.split(".")[2] ~ ".0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://archive.apache.org/dist/{{ name.split('-')[0] }}/{{ name.split('-')[0] }}-{{ version }}/apache-{{ name.split('-')[0] }}-{{ version }}.tar.gz
  sha256: 9a8094d24fa33b90c672ab77fdda253f29300c8b0dd3f0b8e55a29dbd98b82c9

build:
  number: {{ build_number + 100 if cuda_enabled else build_number }}
  string: {{ "cuda"~cuda_compiler_version | replace('.', '') if cuda_enabled else "cpu" }}_h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}
  run_exports:
    - {{ pin_subpackage("arrow-cpp", max_pin="x.x.x") }}
  missing_dso_whitelist:
    - '$RPATH/libpthread.so.*'  # [linux]
    - '$RPATH/libc.so.*'        # [linux]
    - '$RPATH/libdl.so.*'       # [linux]
    - '$RPATH/libm.so.*'        # [linux]
    - '$RPATH/ld64.so.*'        # [linux]
    - "**/libcuda.so*"          # [(gpu_variant or "").startswith("cuda")]
    - "**/nvcuda.dll"           # [(gpu_variant or "").startswith("cuda")]
  ignore_run_exports:
    - libbrotlicommon  # need only headers
    - cuda-cudart-dev  # needed for CMake discovery only; Arrow links cuda_driver not cudart

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    # Arrow does not compile .cu files; cuda-nvcc is included so CMake's
    # find_package(CUDAToolkit) can locate the toolkit reliably.
    - {{ compiler('cuda') }}    # [(gpu_variant or "").startswith("cuda")]
    - autoconf  # [unix]
    - cmake
    # Needed when compiling jemalloc_ep
    - make  # [unix]
    - gnuconfig
    - ninja-base
  host:
    - libabseil {{ libabseil }}
    - aws-sdk-cpp {{ aws_sdk_cpp }}
    - aws-crt-cpp {{ aws_crt_cpp }}
    - libboost-devel {{ libboost_devel }}
    - brotli {{ brotli }}
    - bzip2 {{ bzip2 }}
    # Only required and used on Windows.
    - c-ares {{ c_ares }}  # [win]
    - glog {{ glog }}
    - libgrpc {{ libgrpc }}
    - lz4-c {{ lz4_c }}
    - openssl {{ openssl }}
    - orc {{ orc }}
    - libprotobuf {{ libprotobuf }}
    - rapidjson 1.1.0
    - libre2-11 {{ libre2_11 }}
    - snappy {{ snappy }}
    - thrift-cpp ==0.23.0
    - libutf8proc {{ libutf8proc }}
    - zlib {{ zlib }}
    - zstd {{ zstd }}
    # https://github.com/apache/arrow/blob/main/ci/conda_env_cpp.txt#L50
    - xsimd ==14.2.0
    - libbrotlidec {{ libbrotlidec }}
    - libbrotlienc {{ libbrotlienc }}
    - libthrift ==0.23.0
    # CUDA dependencies
    - cuda-version {{ cuda_compiler_version }}    # [(gpu_variant or "").startswith("cuda")]
    - cuda-cudart-dev {{ cuda_compiler_version }}  # [(gpu_variant or "").startswith("cuda")]
    # cuda-driver-dev only exists for linux on pkgs/main; on Windows, cuda.lib stub
    # ships inside cuda-cudart-dev_win-64 (matches conda-forge libarrow pattern).
    - cuda-driver-dev {{ cuda_compiler_version }}  # [linux and (gpu_variant or "").startswith("cuda")]
    # https://github.com/apache/arrow/blob/apache-arrow-24.0.0/ci/conda_env_cpp.txt#L42
    - nodejs >=16
  run:
    # Through run_exports
    - aws-crt-cpp
    - aws-sdk-cpp
    - bzip2
    - glog
    - libabseil
    - libbrotlidec
    - libbrotlienc
    - libgrpc
    - libprotobuf
    - libthrift
    - libutf8proc
    - lz4-c
    - openssl
    - orc
    - libre2-11
    - snappy
    - zlib
    - zstd
    - c-ares  # [win]
    # CUDA runtime dependencies
    - {{ pin_compatible('cuda-version', max_pin='x.x') }}  # [(gpu_variant or "").startswith("cuda")]
  run_constrained:
    # __cuda in run would block downstream packages (e.g. pyarrow) from installing
    # arrow-cpp CUDA as a host dep in build environments without a GPU.
    # Use run_constrained so the solver doesn't require __cuda at build time.
    # Downstream packages (pyarrow) add __cuda to their own run deps.
    - __cuda  # [(gpu_variant or "").startswith("cuda")]

test:
  commands:
    # headers
    - test -f $PREFIX/include/arrow/api.h              # [unix]
    - test -f $PREFIX/include/arrow/flight/types.h     # [unix]
    - test -f $PREFIX/include/parquet/api/reader.h     # [unix]
    - if not exist %LIBRARY_INC%\\arrow\\api.h exit 1            # [win]
    - if not exist %LIBRARY_INC%\\parquet\\api\\reader.h exit 1  # [win]

    # shared
    - test -f $PREFIX/lib/libarrow${SHLIB_EXT}          # [unix]
    - test -f $PREFIX/lib/libarrow_dataset${SHLIB_EXT}  # [unix]
    - test -f $PREFIX/lib/libarrow_flight${SHLIB_EXT}   # [unix]
    - test -f $PREFIX/lib/libparquet${SHLIB_EXT}        # [unix]
    - if not exist %PREFIX%\\Library\\bin\\arrow.dll exit 1          # [win]
    - if not exist %PREFIX%\\Library\\bin\\arrow_dataset.dll exit 1  # [win]
    - if not exist %PREFIX%\\Library\\bin\\arrow_flight.dll exit 1   # [win]
    - if not exist %PREFIX%\\Library\\bin\\parquet.dll exit 1        # [win]
    # import libraries at the conda-convention path (Library\lib, not Library root)
    - if not exist %PREFIX%\\Library\\lib\\arrow.lib exit 1          # [win]
    - if not exist %PREFIX%\\Library\\lib\\arrow_dataset.lib exit 1  # [win]
    - if not exist %PREFIX%\\Library\\lib\\arrow_flight.lib exit 1   # [win]
    - if not exist %PREFIX%\\Library\\lib\\parquet.lib exit 1        # [win]
    # absence of static libraries
    - test ! -f $PREFIX/lib/libarrow.a         # [unix]
    - test ! -f $PREFIX/lib/libarrow_flight.a  # [unix]
    - test ! -f $PREFIX/lib/libparquet.a       # [unix]
    - if exist %PREFIX%\\Library\\lib\\arrow_static.lib exit 1         # [win]
    - if exist %PREFIX%\\Library\\lib\\arrow_flight_static.lib exit 1  # [win]
    - if exist %PREFIX%\\Library\\lib\\parquet_static.lib exit 1       # [win]

    # CUDA shared libraries and headers
    - test -f $PREFIX/lib/libarrow_cuda${SHLIB_EXT}                                # [unix and (gpu_variant or "").startswith("cuda")]
    - test -f $PREFIX/include/arrow/gpu/cuda_api.h                                 # [unix and (gpu_variant or "").startswith("cuda")]
    - if not exist %PREFIX%\\Library\\bin\\arrow_cuda.dll exit 1                   # [win and (gpu_variant or "").startswith("cuda")]
    - if not exist %PREFIX%\\Library\\lib\\arrow_cuda.lib exit 1                   # [win and (gpu_variant or "").startswith("cuda")]
    - if not exist %PREFIX%\\Library\\include\\arrow\\gpu\\cuda_api.h exit 1       # [win and (gpu_variant or "").startswith("cuda")]

    # gdb-wrapper (paths are stacked intentionally)
    - test -f $PREFIX/share/gdb/auto-load/$PREFIX/lib/libarrow.so.{{ so_version }}-gdb.py     # [linux]
    - test -f $PREFIX/share/gdb/auto-load/$PREFIX/lib/libarrow.{{ so_version }}.dylib-gdb.py  # [osx]

about:
  home: https://github.com/apache/arrow
  license: Apache-2.0
  license_file: LICENSE.txt
  license_family: Apache
  summary: C++ libraries for Apache Arrow
  description: |
    Apache Arrow defines a language-independent columnar memory format
    for flat and hierarchical data, organized for efficient analytic operations
    on modern hardware like CPUs and GPUs.
  dev_url: https://github.com/apache/arrow
  doc_url: https://arrow.apache.org

extra:
  recipe-maintainers:
    - wesm
    - xhochy
    - leifwalsh
    - jreback
    - cpcloud
    - pcmoritz
    - robertnishihara
    - siddharthteotia
    - kou
    - kszucs
    - pitrou
